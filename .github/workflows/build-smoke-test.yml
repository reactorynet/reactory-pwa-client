name: Build smoke test

# Confirms the pwa-client container image actually builds. Before
# config/env/reactory/Dockerfile existed (added July 2026), bin/podman-build.sh
# failed outright with no automated check ever catching it — reactory-express-
# server's docker-compose expects this image to exist and nothing verified it
# could be produced.
#
# Uses `docker build` directly rather than bin/podman-build.sh so the check
# doesn't require installing podman on the runner; the Dockerfile itself is
# runtime-agnostic.

on:
  push:
    branches: [master]
    paths:
      - "config/env/**"
      - "scripts/**"
      - "src/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/build-smoke-test.yml"
  pull_request:
    paths:
      - "config/env/**"
      - "scripts/**"
      - "src/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/build-smoke-test.yml"
  workflow_dispatch: {}

jobs:
  build-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # src/components/plugins/reactory-core is a submodule the bundle imports.
          submodules: true

      # Corepack first: setup-node's Yarn cache lookup runs `yarn`, and the
      # runner's global Yarn 1 refuses this repo's packageManager (yarn@4).
      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack for the selected Node
        run: corepack enable

      # yarn.lock is not tracked in this repo, so there is no lockfile to hold the install to.
      - name: Install dependencies
        run: yarn install --no-immutable

      # config/env/ is gitignored, so CI writes a throwaway podman environment.
      # Every value is public by design (REACT_APP_* ship in the bundle).
      - name: Write a placeholder podman environment
        run: |
          [ -f config/env/reactory/.env.podman ] || cat > config/env/reactory/.env.podman <<'ENV'
          REACT_APP_API_ENDPOINT=http://localhost:4000
          REACT_APP_CDN=http://localhost:4000/cdn
          REACT_APP_TITLE='reactory:reactory.application.title'
          REACT_APP_THEME=reactory
          REACT_APP_CLIENT_KEY=reactory
          REACT_APP_SHORTNAME=reactory:reactory.application.title
          REACT_APP_CLIENT_PUBLIC_KEY=ci-public-key
          REACT_APP_THEME_PRIMARY=#f95e20
          REACT_APP_THEME_BG=#424242
          CI=false
          PORT=3000
          NODE_ENV=production
          BABEL_ENV=production
          ENV

      # yarn exec puts the project's binaries (env-cmd) on PATH; build.sh calls
      # them bare, which only worked where they were installed globally.
      - name: Build static bundle
        run: yarn exec bin/build.sh reactory podman

      # The image copies the bundle built above (build/reactory/podman), so it
      # builds in this job; on its own it had no bundle to copy.
      - name: Build client image
        run: docker build -f config/env/reactory/Dockerfile -t reactory-pwa-client:ci .
