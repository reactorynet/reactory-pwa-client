name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

# Optional GitHub App for private submodules (see "Submodule checkout token").
# Set the SUBMODULE_APP_CLIENT_ID and SUBMODULE_APP_PRIVATE_KEY secrets to enable it.
env:
  SUBMODULE_APP_CLIENT_ID: ${{ secrets.SUBMODULE_APP_CLIENT_ID }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      # src/components/plugins/reactory-core is a submodule that `src/` imports
      # directly (e.g. shared/UserProfile's Demographics section imports the
      # shared demographic form). Without it the directory is empty and both
      # `tsc` and `jest` fail with "Cannot find module .../reactory-core/...".
      # build-smoke-test.yml already checks submodules out for the same reason.
      # GITHUB_TOKEN only reads this repo, so a clone whose submodules resolve to
      # private repos can't check them out with it. When the app secrets are set,
      # mint a read-only token scoped to this repo and the plugin submodules;
      # otherwise skip this and check out with the default token.
      - name: Submodule checkout token
        id: submodule-token
        if: env.SUBMODULE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.SUBMODULE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUBMODULE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            reactory-client-core-pwa-plugin
            reactory-communicator-pwa-plugin
          permission-contents: read

      - uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ steps.submodule-token.outputs.token || github.token }}

      # Corepack first: setup-node's Yarn cache lookup runs `yarn`, and the
      # runner's global Yarn 1 refuses this repo's packageManager (yarn@4).
      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          # No cache: setup-node keys it on a lockfile, and yarn.lock is not tracked.

      - name: Enable Corepack for the selected Node
        run: corepack enable

      # yarn.lock IS tracked, so an immutable install fails loudly if package.json
      # and the lockfile ever disagree.
      - name: Install dependencies
        run: yarn install --immutable

      - name: Run TypeCheck
        run: yarn typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN only reads this repo, so a clone whose submodules resolve to
      # private repos can't check them out with it. When the app secrets are set,
      # mint a read-only token scoped to this repo and the plugin submodules;
      # otherwise skip this and check out with the default token.
      - name: Submodule checkout token
        id: submodule-token
        if: env.SUBMODULE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.SUBMODULE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUBMODULE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            reactory-client-core-pwa-plugin
            reactory-communicator-pwa-plugin
          permission-contents: read

      - uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ steps.submodule-token.outputs.token || github.token }}

      # Corepack first: setup-node's Yarn cache lookup runs `yarn`, and the
      # runner's global Yarn 1 refuses this repo's packageManager (yarn@4).
      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          # No cache: setup-node keys it on a lockfile, and yarn.lock is not tracked.

      - name: Enable Corepack for the selected Node
        run: corepack enable

      # yarn.lock IS tracked, so an immutable install fails loudly if package.json
      # and the lockfile ever disagree.
      - name: Install dependencies
        run: yarn install --immutable

      # Correctness rules only (eslint.ci.config.mjs).
      - name: Run ESLint
        run: yarn lint

  test:
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN only reads this repo, so a clone whose submodules resolve to
      # private repos can't check them out with it. When the app secrets are set,
      # mint a read-only token scoped to this repo and the plugin submodules;
      # otherwise skip this and check out with the default token.
      - name: Submodule checkout token
        id: submodule-token
        if: env.SUBMODULE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.SUBMODULE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUBMODULE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            reactory-client-core-pwa-plugin
            reactory-communicator-pwa-plugin
          permission-contents: read

      - uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ steps.submodule-token.outputs.token || github.token }}

      # Corepack first: setup-node's Yarn cache lookup runs `yarn`, and the
      # runner's global Yarn 1 refuses this repo's packageManager (yarn@4).
      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          # No cache: setup-node keys it on a lockfile, and yarn.lock is not tracked.

      - name: Enable Corepack for the selected Node
        run: corepack enable

      # yarn.lock IS tracked, so an immutable install fails loudly if package.json
      # and the lockfile ever disagree.
      - name: Install dependencies
        run: yarn install --immutable

      - name: Run Tests
        run: yarn test:ci

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total; const row=k=>'| '+k+' | '+t[k].pct+'% | '+t[k].covered+'/'+t[k].total+' |'; console.log(['### PWA coverage','','| Metric | % | Covered |','|---|---|---|',row('lines'),row('statements'),row('functions'),row('branches')].join('\\n'))" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pwa-coverage
          # Not the HTML report: it holds a directory named `file:`, and a colon
          # is not a valid artifact path.
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
          if-no-files-found: ignore
