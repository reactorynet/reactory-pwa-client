name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Corepack first: setup-node's Yarn cache lookup runs `yarn`, and the
      # runner's global Yarn 1 refuses this repo's packageManager (yarn@4).
      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          # No cache: setup-node keys it on a lockfile, and yarn.lock is not tracked.

      - name: Enable Corepack for the selected Node
        run: corepack enable

      # yarn.lock is not tracked in this repo, so there is no lockfile to hold the install to.
      - name: Install dependencies
        run: yarn install --no-immutable

      - name: Run TypeCheck
        run: yarn typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Corepack first: setup-node's Yarn cache lookup runs `yarn`, and the
      # runner's global Yarn 1 refuses this repo's packageManager (yarn@4).
      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          # No cache: setup-node keys it on a lockfile, and yarn.lock is not tracked.

      - name: Enable Corepack for the selected Node
        run: corepack enable

      # yarn.lock is not tracked in this repo, so there is no lockfile to hold the install to.
      - name: Install dependencies
        run: yarn install --no-immutable

      # Correctness rules only (eslint.ci.config.mjs).
      - name: Run ESLint
        run: yarn lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Corepack first: setup-node's Yarn cache lookup runs `yarn`, and the
      # runner's global Yarn 1 refuses this repo's packageManager (yarn@4).
      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          # No cache: setup-node keys it on a lockfile, and yarn.lock is not tracked.

      - name: Enable Corepack for the selected Node
        run: corepack enable

      # yarn.lock is not tracked in this repo, so there is no lockfile to hold the install to.
      - name: Install dependencies
        run: yarn install --no-immutable

      - name: Run Tests
        run: yarn test:ci

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total; const row=k=>'| '+k+' | '+t[k].pct+'% | '+t[k].covered+'/'+t[k].total+' |'; console.log(['### PWA coverage','','| Metric | % | Covered |','|---|---|---|',row('lines'),row('statements'),row('functions'),row('branches')].join('\\n'))" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-coverage
          # Not the HTML report: it holds a directory named `file:`, and a colon
          # is not a valid artifact path.
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
          if-no-files-found: ignore
