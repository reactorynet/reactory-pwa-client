# SPA server config for the reactory-pwa-client container images.
# Copied into /etc/nginx/conf.d/default.conf by ./Dockerfile and
# config/env/reactory/Dockerfile; validated at image build time with `nginx -t`.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in the Server header or error pages.
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|svg|gif|map|png|html|ico|jpg|jpeg)$ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }
}
